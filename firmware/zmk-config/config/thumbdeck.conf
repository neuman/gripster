# thumbdeck.conf — single-controller build config (v0.3).

# --- Connectivity ---------------------------------------------------------
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
# One nRF52840: BLE to the host, or wired USB-C HID when plugged in.

# --- Battery reporting ----------------------------------------------------
# Single LiPo on the nice!nano's onboard fuel gauge / divider. No split proxy.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# --- Power / sleep --------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- Optional: boost BLE TX power on nRF52840 ----------------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
