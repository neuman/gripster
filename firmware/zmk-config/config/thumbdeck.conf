# thumbdeck.conf — single-controller (non-split) build config for the E73 board.

# --- Connectivity ---------------------------------------------------------
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
# One nRF52840: BLE to the host, or wired USB-C HID when plugged in.

# --- Mouse buttons (D-pad OK + L/R click keys are matrix keys) -------------
# ZMK_POINTING is the current symbol at v0.3.0 (ZMK_MOUSE is deprecated there).
CONFIG_ZMK_POINTING=y

# --- Battery reporting ----------------------------------------------------
# External 1M/1M divider on P0.02/AIN0 (see thumbdeck.dts vbatt node).
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# --- Power / sleep --------------------------------------------------------
CONFIG_ZMK_SLEEP=y
# v0.21: device PM so deep sleep also SUSPENDS the nub sensor (the tmag5273_nub
# driver's pm hook writes it into sleep mode — else it free-runs at ~2.3 mA on
# the always-up REG0 rail and drains the cell in ~a week of "sleep")
CONFIG_PM_DEVICE=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- Boost BLE TX power on nRF52840 (phone + hand detune the antenna) ------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
