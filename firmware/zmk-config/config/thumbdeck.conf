# thumbdeck.conf — build-time config for both halves.
# Applied to thumbdeck_left and thumbdeck_right builds.

# --- Connectivity ---------------------------------------------------------
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
# Central (right) presents USB HID when plugged in; peripheral still links over
# BLE to the central in wired mode (ZMK split model — see docs).

# --- Battery / split battery reporting -----------------------------------
# Report each half's battery level; central proxies the peripheral's level.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- Power / sleep --------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- Optional: boost BLE TX power on nRF52840 ----------------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
