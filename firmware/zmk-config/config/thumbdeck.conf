# thumbdeck.conf — single-controller (non-split) build config for the E73 board.

# --- Connectivity ---------------------------------------------------------
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
# One nRF52840: BLE to the host, or wired USB-C HID when plugged in.

# --- Mouse buttons (D-pad OK + L/R click keys are matrix keys) -------------
CONFIG_ZMK_MOUSE=y

# --- Battery reporting ----------------------------------------------------
# External 1M/1M divider on P0.02/AIN0 (see thumbdeck.dts vbatt node).
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# --- Power / sleep --------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- Boost BLE TX power on nRF52840 (phone + hand detune the antenna) ------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
