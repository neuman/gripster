<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="sans-serif">
  <rect width="820" height="360" fill="#0b0f14"/>
  <text x="410" y="34" fill="#ffd60a" font-size="20" font-weight="bold" text-anchor="middle">thumbdeck — system architecture</text>

  <!-- LEFT peripheral -->
  <rect x="40" y="90" width="200" height="180" rx="14" fill="#132a13" stroke="#ffd60a" stroke-width="2"/>
  <text x="140" y="118" fill="#f4d35e" font-size="15" font-weight="bold" text-anchor="middle">LEFT half</text>
  <text x="140" y="138" fill="#89c2d9" font-size="12" text-anchor="middle">PERIPHERAL</text>
  <text x="140" y="170" fill="#e5e5e5" font-size="11" text-anchor="middle">nRF52840 (XIAO)</text>
  <text x="140" y="188" fill="#e5e5e5" font-size="11" text-anchor="middle">5×5 matrix · 25 keys</text>
  <text x="140" y="206" fill="#e5e5e5" font-size="11" text-anchor="middle">LiPo + USB-C charge</text>
  <text x="140" y="224" fill="#e5e5e5" font-size="11" text-anchor="middle">col-offset = 5</text>

  <!-- RIGHT central -->
  <rect x="420" y="90" width="200" height="180" rx="14" fill="#132a13" stroke="#ffd60a" stroke-width="2"/>
  <text x="520" y="118" fill="#f4d35e" font-size="15" font-weight="bold" text-anchor="middle">RIGHT half</text>
  <text x="520" y="138" fill="#89c2d9" font-size="12" text-anchor="middle">CENTRAL</text>
  <text x="520" y="170" fill="#e5e5e5" font-size="11" text-anchor="middle">nRF52840 (XIAO)</text>
  <text x="520" y="188" fill="#e5e5e5" font-size="11" text-anchor="middle">5×5 matrix · 25 keys</text>
  <text x="520" y="206" fill="#e5e5e5" font-size="11" text-anchor="middle">LiPo + USB-C charge</text>
  <text x="520" y="224" fill="#e5e5e5" font-size="11" text-anchor="middle">applies 50-key keymap</text>

  <!-- HOST -->
  <rect x="690" y="120" width="90" height="120" rx="12" fill="#1d1d1d" stroke="#89c2d9" stroke-width="2"/>
  <text x="735" y="175" fill="#89c2d9" font-size="13" font-weight="bold" text-anchor="middle">HOST</text>
  <text x="735" y="195" fill="#adb5bd" font-size="11" text-anchor="middle">phone/PC</text>

  <!-- BLE link left<->right -->
  <line x1="240" y1="180" x2="420" y2="180" stroke="#7fd1ff" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="330" y="170" fill="#7fd1ff" font-size="12" text-anchor="middle">BLE split</text>

  <!-- central <-> host -->
  <line x1="620" y1="165" x2="690" y2="165" stroke="#7fd1ff" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="655" y="155" fill="#7fd1ff" font-size="10" text-anchor="middle">BLE</text>
  <line x1="620" y1="205" x2="690" y2="205" stroke="#e07a5f" stroke-width="2.5"/>
  <text x="655" y="223" fill="#e07a5f" font-size="10" text-anchor="middle">USB-C</text>

  <text x="410" y="310" fill="#9aa" font-size="12" text-anchor="middle">Wireless: host ⇄BLE⇄ central ⇄BLE⇄ peripheral   ·   Wired: host ⇄USB-C⇄ central (peripheral still BLE)</text>
  <text x="410" y="332" fill="#666" font-size="11" text-anchor="middle">No inter-half cable · per-half battery reporting · ZMK</text>
</svg>
