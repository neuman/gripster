name: Deploy site to GitHub Pages

# Builds site/ (Vite) and publishes it to GitHub Pages. The compressed model
# GLBs are committed under site/public/models, so CI only bundles JS — it does
# NOT run the CAD/KiCad toolchain (that stays a local `npm run models` step).

on:
  push:
    # main ONLY — there is one live site, not a page per branch. feature/right-joystick
    # used to be listed here while it was in flight; because it shared the `pages`
    # concurrency group below, a simultaneous push to both branches meant whichever
    # landed second cancelled the other, and main lost 4 of its last 5 runs that way.
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one live deployment at a time; newer pushes supersede in-flight ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # the committed og-card.png is used as-is; never fetch Playwright's browser in CI
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
