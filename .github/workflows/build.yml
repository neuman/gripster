name: Build ZMK firmware

# Self-contained build (NOT ZMK's reusable build-user-config workflow: that one
# runs `west init -l <config>` and then `west update` from the REPO root, which
# only works when the config's parent IS the repo root — ours lives under
# firmware/zmk-config/, so the reusable workflow provably cannot pass here).
# ZMK is pinned to v0.3.0 in firmware/zmk-config/config/west.yml (last
# HWMv1-compatible release, Zephyr 3.5). The board is a real board definition
# (config/boards/arm/thumbdeck) discovered via ZMK_CONFIG, not a shield.
on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    defaults:
      run:
        working-directory: firmware/zmk-config
    steps:
      - uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            firmware/zmk-config/modules
            firmware/zmk-config/tools
            firmware/zmk-config/zephyr
            firmware/zmk-config/zmk
          key: west-${{ hashFiles('firmware/zmk-config/config/west.yml') }}

      - name: West init + update
        run: |
          test -d .west || west init -l config
          west update
          west zephyr-export

      - name: Build thumbdeck
        run: |
          west build -s zmk/app -p always -b thumbdeck -- \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/firmware/zmk-config/config" \
            -DZEPHYR_EXTRA_MODULES="${GITHUB_WORKSPACE}/firmware/zmk-modules/tmag5273_nub"

      - name: Rename firmware
        run: cp build/zephyr/zmk.uf2 thumbdeck-zmk.uf2

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: thumbdeck-zmk-uf2
          path: firmware/zmk-config/thumbdeck-zmk.uf2
